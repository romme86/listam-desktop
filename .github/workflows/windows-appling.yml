# Builds the Windows appling (Listam.exe) on a Windows runner.
#
# The appling is a small native shell that bootstraps the Pear runtime itself
# and then boots the app from its P2P drive, so Windows users no longer have to
# install Pear separately. It embeds only a drive key — the app payload travels
# over the swarm — so this job needs neither the listam-packages sibling nor a
# `pear stage`, unlike the lint+test job in ci.yml.
#
# Manual dispatch only: the build fetches well over a gigabyte of native
# dependencies and is not a gate on ordinary pushes.
name: windows-appling

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'z32 drive key to embed (blank = production default in CMakeLists.txt)'
        required: false
        type: string
      version:
        description: 'Version stamped into the exe (blank = version in package.json)'
        required: false
        type: string
      msix:
        description: 'Also pack an MSIX for the Microsoft Store'
        required: false
        default: false
        type: boolean
      package_identity_name:
        description: 'MSIX Identity Name from Partner Center (e.g. 12345SayNode.Listam)'
        required: false
        type: string
      package_publisher:
        description: 'MSIX Publisher from Partner Center (e.g. CN=A1B2C3D4-...)'
        required: false
        type: string
      publisher_display_name:
        description: 'MSIX PublisherDisplayName from Partner Center (e.g. SayNode)'
        required: false
        type: string

jobs:
  build:
    name: Listam.exe (win32-x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # bare switches to ASM_NASM on win32-x64. The runner image ships neither
      # nasm nor ninja, and without them cmake fails deep inside a dependency
      # with a misleading message. MSVC needs no setup action — the build
      # script enters the VS environment itself.
      # innosetup builds the installer users actually download; without it the
      # build still succeeds but ships only the portable zip.
      - name: Install build tools
        run: choco install nasm ninja innosetup -y --no-progress

      - name: Add NASM to PATH
        run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      # libappling's test fixtures nest a 64-char key directory inside a
      # "Pear Runtime.app/Contents/MacOS" path, which overflows MAX_PATH: git
      # aborts the checkout with "Filename too long" mid-configure.
      - name: Enable git long paths
        run: git config --global core.longpaths true

      # Single entry point: CI runs exactly what a developer runs locally.
      # Keep build logic in build-windows.ps1, never inline here.
      - name: Build
        shell: pwsh
        env:
          LISTAM_ID: ${{ inputs.id }}
          LISTAM_VERSION: ${{ inputs.version }}
          LISTAM_MSIX: ${{ inputs.msix }}
          LISTAM_PKG_NAME: ${{ inputs.package_identity_name }}
          LISTAM_PKG_PUBLISHER: ${{ inputs.package_publisher }}
          LISTAM_PKG_DISPLAY: ${{ inputs.publisher_display_name }}
        run: |
          $params = @{}
          if ($env:LISTAM_ID)      { $params['Id']      = $env:LISTAM_ID }
          if ($env:LISTAM_VERSION) { $params['Version'] = $env:LISTAM_VERSION }
          if ($env:LISTAM_MSIX -eq 'true') { $params['Msix'] = $true }
          if ($env:LISTAM_PKG_NAME)      { $params['PackageIdentityName']  = $env:LISTAM_PKG_NAME }
          if ($env:LISTAM_PKG_PUBLISHER) { $params['PackagePublisher']     = $env:LISTAM_PKG_PUBLISHER }
          if ($env:LISTAM_PKG_DISPLAY)   { $params['PublisherDisplayName'] = $env:LISTAM_PKG_DISPLAY }
          installer\build-windows.ps1 @params

      - name: Resolve artifact name
        id: meta
        shell: pwsh
        env:
          LISTAM_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:LISTAM_VERSION
          if (-not $version) {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # The installer is the release deliverable; the staged pair is uploaded
      # separately so the raw exe stays inspectable without unpacking an
      # installer to get at it.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Listam-Setup-${{ steps.meta.outputs.version }}-win32-x64
          path: installer/dist/Listam-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable payload
        uses: actions/upload-artifact@v4
        with:
          name: Listam-${{ steps.meta.outputs.version }}-win32-x64
          path: installer/dist/stage-win32-x64/
          if-no-files-found: error

      - name: Upload MSIX
        if: inputs.msix
        uses: actions/upload-artifact@v4
        with:
          name: Listam-${{ steps.meta.outputs.version }}-win32-x64-msix
          path: installer/dist/*.msix
          if-no-files-found: error
